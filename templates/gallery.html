{% extends 'base.html' %}

{% block title %}Gallery | Holy Mary International School{% endblock %}

{% block content %}
<!-- Page Banner -->
<section class="relative bg-slate-900 py-16 text-center text-white overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-r from-themePinkDark/80 via-slate-900/90 to-themePinkDark/80 z-10"></div>
  <div class="relative z-20 max-w-4xl mx-auto px-4">
    <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-wider">Photo Gallery</h1>
    <div class="flex items-center justify-center gap-1 my-3">
      <div class="w-12 h-1 bg-amber-400 rounded"></div>
      <div class="w-3 h-1 bg-amber-400 rounded"></div>
    </div>
    <nav class="flex justify-center items-center gap-2 text-xs text-slate-300 font-medium">
      <a href="{% url 'home' %}" class="hover:text-amber-400 transition">Home</a>
      <span>&gt;</span>
      <span class="text-amber-400 font-semibold">Gallery</span>
    </nav>
  </div>
</section>

<!-- Gallery Content -->
<section class="py-14 bg-slate-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Filter Buttons -->
    <div class="flex flex-wrap justify-center gap-2 mb-10" id="filter-buttons">
      <button onclick="filterGallery('all')" class="gallery-btn active bg-themePink text-white px-4 py-1.5 rounded-full text-xs font-bold uppercase transition">All</button>
      <button onclick="filterGallery('campus')" class="gallery-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-4 py-1.5 rounded-full text-xs font-bold uppercase transition">Campus</button>
      <button onclick="filterGallery('labs')" class="gallery-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-4 py-1.5 rounded-full text-xs font-bold uppercase transition">Labs & Classrooms</button>
      <button onclick="filterGallery('events')" class="gallery-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-4 py-1.5 rounded-full text-xs font-bold uppercase transition">Events & Sports</button>
    </div>

    <!-- Image Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="gallery-grid">
      
      <div class="gallery-item campus overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm group cursor-pointer" onclick="openLightbox(this)">
        <div class="h-52 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=800&q=80" alt="Main Building" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
        </div>
        <div class="p-3 text-center">
          <p class="text-xs font-bold text-slate-800 uppercase">Main Academic Wing</p>
        </div>
      </div>

      <div class="gallery-item labs overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm group cursor-pointer" onclick="openLightbox(this)">
        <div class="h-52 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=800&q=80" alt="Science Lab" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
        </div>
        <div class="p-3 text-center">
          <p class="text-xs font-bold text-slate-800 uppercase">Physics & Chemistry Lab</p>
        </div>
      </div>

      <div class="gallery-item labs overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm group cursor-pointer" onclick="openLightbox(this)">
        <div class="h-52 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=800&q=80" alt="Computer Lab" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
        </div>
        <div class="p-3 text-center">
          <p class="text-xs font-bold text-slate-800 uppercase">Computer Science Lab</p>
        </div>
      </div>

      <div class="gallery-item campus overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm group cursor-pointer" onclick="openLightbox(this)">
        <div class="h-52 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=800&q=80" alt="School Transport" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
        </div>
        <div class="p-3 text-center">
          <p class="text-xs font-bold text-slate-800 uppercase">School Transport Fleet</p>
        </div>
      </div>

      <div class="gallery-item events overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm group cursor-pointer" onclick="openLightbox(this)">
        <div class="h-52 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80" alt="Morning Assembly" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
        </div>
        <div class="p-3 text-center">
          <p class="text-xs font-bold text-slate-800 uppercase">Morning Assembly</p>
        </div>
      </div>

      <div class="gallery-item events overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm group cursor-pointer" onclick="openLightbox(this)">
        <div class="h-52 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1526729553888-0fbe4a2a1988?auto=format&fit=crop&w=800&q=80" alt="Annual Sports" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
        </div>
        <div class="p-3 text-center">
          <p class="text-xs font-bold text-slate-800 uppercase">Sports Day Celebrations</p>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- Lightbox Modal -->
<div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
  <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white hover:text-amber-400 p-2">
    <i data-lucide="x" class="w-8 h-8"></i>
  </button>
  <img id="lightbox-img" src="" alt="Enlarged preview" class="max-w-full max-h-[80vh] rounded shadow-2xl mb-3 object-contain"/>
  <p id="lightbox-caption" class="text-white text-sm font-semibold uppercase"></p>
</div>

<script>
  function filterGallery(category) {
    const items = document.querySelectorAll('.gallery-item');
    const buttons = document.querySelectorAll('.gallery-btn');

    buttons.forEach(btn => {
      btn.className = "gallery-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-4 py-1.5 rounded-full text-xs font-bold uppercase transition";
    });
    event.target.className = "gallery-btn active bg-themePink text-white px-4 py-1.5 rounded-full text-xs font-bold uppercase transition";

    items.forEach(item => {
      if (category === 'all' || item.classList.contains(category)) {
        item.style.display = 'block';
      } else {
        item.style.display = 'none';
      }
    });
  }

  function openLightbox(element) {
    const img = element.querySelector('img');
    const caption = element.querySelector('p').textContent;
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox-caption').textContent = caption;
    document.getElementById('lightbox').classList.remove('hidden');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.add('hidden');
  }
</script>
{% endblock %}
