{% extends 'base.html' %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full bg-white border border-slate-200/90 rounded-2xl shadow-sm p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-slate-900 text-white rounded-xl flex items-center justify-center mx-auto mb-3">
        <i class="bi bi-person-plus-fill text-xl"></i>
      </div>
      <h2 class="text-xl font-black text-slate-900 tracking-tight">Register Staff Account</h2>
      <p class="text-xs text-slate-500 mt-1">Sign up for teacher &amp; school administrative access</p>
    </div>

    <form method="POST" class="space-y-3.5">
      {% csrf_token %}

      {% for field in form %}
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="text-[11px] text-red-600 font-medium block mt-1">{{ field.errors.0 }}</span>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold uppercase tracking-wider shadow-sm transition mt-2">
        Create Account
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      Already have an account? 
      <a href="{% url 'login' %}" class="font-bold text-red-600 hover:underline">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
