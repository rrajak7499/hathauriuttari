{% extends 'base.html' %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full bg-white border border-slate-200/90 rounded-2xl shadow-sm p-6 sm:p-8 text-center">
    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center mx-auto mb-4">
      <i class="bi bi-envelope-check-fill text-2xl"></i>
    </div>
    <h2 class="text-xl font-black text-slate-900 tracking-tight mb-2">Check Your Email</h2>
    <p class="text-xs text-slate-500 mb-6 leading-relaxed">
      If an account exists with that address, we have emailed instructions for resetting your password.
    </p>
    <a href="{% url 'login' %}" class="inline-block px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition">
      Return to Login
    </a>
  </div>
</div>
{% endblock %}
