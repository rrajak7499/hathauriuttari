{% extends 'base.html' %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full bg-white border border-slate-200/90 rounded-2xl shadow-sm p-6 sm:p-8 text-center">
    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center mx-auto mb-4">
      <i class="bi bi-patch-check-fill text-2xl"></i>
    </div>
    <h2 class="text-xl font-black text-slate-900 tracking-tight mb-2">Password Successfully Reset</h2>
    <p class="text-xs text-slate-500 mb-6">You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="inline-block px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition">
      Sign In
    </a>
  </div>
</div>
{% endblock %}
