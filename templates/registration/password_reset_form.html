{% extends 'base.html' %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full bg-white border border-slate-200/90 rounded-2xl shadow-sm p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-amber-500 text-white rounded-xl flex items-center justify-center mx-auto mb-3">
        <i class="bi bi-key-fill text-xl"></i>
      </div>
      <h2 class="text-xl font-black text-slate-900 tracking-tight">Forgot Password</h2>
      <p class="text-xs text-slate-500 mt-1">Enter your registered email address to receive recovery instructions.</p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
        {{ form.email }}
        {% if form.email.errors %}
          <span class="text-[11px] text-red-600 font-medium block mt-1">{{ form.email.errors.0 }}</span>
        {% endif %}
      </div>

      <button type="submit" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold uppercase tracking-wider shadow-sm transition">
        Send Reset Link
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      Remembered your password? 
      <a href="{% url 'login' %}" class="font-bold text-red-600 hover:underline">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
