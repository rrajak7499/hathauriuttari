<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect | Senior Secondary Institute (Classes 9–12)</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons for clean academic symbols -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f3460',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="flex flex-col min-h-full font-sans text-slate-800 antialiased">

  <!-- Minimal Tailwind Navbar -->
  {% include 'include/navbar.html' %}

  <!-- Messages / Alerts -->
  <!-- Inside base.html messages block -->
<!-- Floating Notification Overlay (Takes zero document space) -->
{% if messages %}
  <div id="messages-container" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 w-full max-w-lg px-4 pointer-events-none space-y-2">
    {% for message in messages %}
      <div class="alert-message pointer-events-auto transition-all duration-300 ease-out transform shadow-xl flex items-center justify-between p-3.5 rounded-2xl border backdrop-blur-md
        {% if message.tags == 'warning' %} bg-amber-500/95 border-amber-400 text-white
        {% elif message.tags == 'error' or message.tags == 'danger' %} bg-rose-600/95 border-rose-500 text-white
        {% elif message.tags == 'success' %} bg-emerald-600/95 border-emerald-500 text-white
        {% else %} bg-slate-900/95 border-slate-700 text-white {% endif %}">
        
        <div class="flex items-center gap-2.5 text-xs font-semibold pr-2">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>{{ message }}</span>
        </div>

        <button type="button" onclick="dismissAlert(this.closest('.alert-message'))" class="text-white/70 hover:text-white font-bold text-lg leading-none p-1 shrink-0">
          &times;
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}

  <!-- Main View -->
  <main class="flex-grow">
    {% block content %}{% endblock %}
  </main>

  <!-- Minimal Tailwind Footer -->
  {% include 'include/footer.html' %}

</body>
<script>
  function dismissAlert(alertEl) {
    if (!alertEl) return;
    // Fade out and collapse height smoothly
    alertEl.style.opacity = '0';
    alertEl.style.transform = 'translateY(-8px)';
    setTimeout(() => {
      alertEl.remove();
      // Remove container if no alerts remain
      const container = document.getElementById('messages-container');
      if (container && container.children.length === 0) {
        container.remove();
      }
    }, 500);
  }

  document.addEventListener('DOMContentLoaded', function () {
    const alerts = document.querySelectorAll('.alert-message');
    
    alerts.forEach(function (alertEl) {
      // Automatically dismiss each alert after 4 seconds (4000ms)
      setTimeout(function () {
        dismissAlert(alertEl);
      }, 4000);
    });
  });
</script>
</html>
