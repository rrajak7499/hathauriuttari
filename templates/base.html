<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect | Senior Secondary Institute (Classes 9–12)</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons for clean academic symbols -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f3460',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="flex flex-col min-h-full font-sans text-slate-800 antialiased">

  <!-- Minimal Tailwind Navbar -->
  {% include 'include/navbar.html' %}

  <!-- Messages / Alerts -->
  {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4">
      {% for msg in messages %}
        <div class="p-4 rounded-xl border {% if msg.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800{% elif msg.tags == 'error' or msg.tags == 'danger' %}bg-rose-50 border-rose-200 text-rose-800{% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %} flex justify-between items-center text-sm font-medium">
          <div class="flex items-center gap-2">
            <i class="bi bi-info-circle-fill"></i>
            <span>{{ msg }}</span>
          </div>
          <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <!-- Main View -->
  <main class="flex-grow">
    {% block content %}{% endblock %}
  </main>

  <!-- Minimal Tailwind Footer -->
  {% include 'include/footer.html' %}

</body>
</html>
